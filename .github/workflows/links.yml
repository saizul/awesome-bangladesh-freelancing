name: Check links

on:
  pull_request:
    paths:
      - '**.md'
      - 'lychee.toml'
      - '.github/workflows/links.yml'
  schedule:
    # Every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml './**/*.md'
          format: markdown
          output: ./lychee/out.md
          fail: false
          jobSummary: true

      # Scheduled runs open (or update) an issue instead of failing silently.
      - name: Open an issue for broken links
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links report
          content-filepath: ./lychee/out.md
          labels: link-check

      # Pull requests fail so broken links are caught before merging.
      - name: Fail on broken links in pull requests
        if: github.event_name == 'pull_request' && steps.lychee.outputs.exit_code != 0
        run: |
          echo "Broken links found. See the job summary for details."
          exit 1
