# Link checker configuration for lycheeverse/lychee-action.
# Docs: https://lychee.cli.rs/config/

# Network behaviour
timeout = 30
max_retries = 3
retry_wait_time = 5
max_redirects = 10
max_concurrency = 8

# Be polite to sites that rate-limit (several entries share a domain).
# Some sites reject the default client signature, so present a browser-like one.
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

# Status codes treated as success.
#  - 200..=299 and 3xx are normal.
#  - 403 / 429 / 999 come from bot protection or rate limiting (Cloudflare,
#    Reddit, LinkedIn, ...). The page exists, the checker is just blocked.
accept = ["200..=299", "301", "302", "307", "308", "403", "429", "999"]

# Only http(s) links matter for this list.
scheme = ["https", "http"]
include_mail = false

# Do not check badge/service endpoints that are not part of the curated list.
exclude = [
  '^https://awesome\.re',
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  '^https?://example\.(com|org|net)',
  # Bot-protected sites that answer automated requests with 400/401 although the pages exist.
  '^https://(www\.|developers\.)?facebook\.com',
  '^https://unsplash\.com',
]

# Cache results between runs (the workflow also persists .lycheecache).
cache = true
max_cache_age = "1d"

no_progress = true
